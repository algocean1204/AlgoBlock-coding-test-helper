name: 기능 제안
description: 있으면 좋을 기능이나 고치면 좋을 점
title: "[제안] "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 불편이 있나
      description: 무엇을 하려다 막혔는지
