# PR과 main 푸시마다 시험과 공개 전 검사를 돌린다. 모델을 부르지 않는다(키가 필요 없다).
# 기본 문제 전체 검사(ui/problemkit.py check)는 느린 풀이가 시간 초과할 때까지 기다려 수십 분이 걸리므로 여기서 돌리지 않는다.
# 액션은 커밋 SHA로 고정한다(뒤의 주석이 그 버전이다). 갱신은 .github/dependabot.yml이 PR로 올린다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: engine-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install langgraph pypdf
      - name: 튜터 엔진 시험
        working-directory: app
        run: python -B -m unittest discover -s tutor/tests -t .
      - name: 화면 서버 시험
        working-directory: app
        run: python -B ui/test_server.py

  judge-tests:
    name: judge-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 채점기 자체 시험 (러너에 있는 언어만 돈다)
        working-directory: app/judge
        run: python -B -m unittest test_check

  # Windows(베타): 엔진·채점기 시험, 임베딩 색인 시간, exe 빌드, 소스와 exe로 띄운 서버에 기본 문제 하나 제출.
  # 채점기 시험은 러너에 있는 언어만 돈다(없는 언어는 건너뛴다). 모델을 부르지 않는다
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1" # Windows 기본 인코딩으로 한글 출력이 깨지지 않게
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # 준비(패키지, 모델)가 된 뒤의 시험 단계는 앞 단계가 실패해도 모두 돈다(한 번에 다 보이게). 하나라도 실패하면 작업은 실패다
      - name: 파이썬 패키지, Java 17, 제출 확인 스크립트
        id: deps
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -q langgraph pypdf qdrant-client onnxruntime tokenizers uv
          if ($env:JAVA_HOME_17_X64) { Add-Content $env:GITHUB_PATH "$env:JAVA_HOME_17_X64\bin" } # 러너의 기본 java가 8일 수 있다
          python -B -c "import json, os; p = json.load(open('app/ui/builtin.json', encoding='utf-8'))[0]; open(os.environ['RUNNER_TEMP'] + '/submit.json', 'w', encoding='utf-8').write(json.dumps({'id': p['id'], 'code': p['solutions']['python']}))"
          # 서버를 띄워 기본 문제 하나(첫 문제의 Python 풀이)를 제출하고 통과와 실행 제한(작업 객체)이 걸렸는지 본다. 소스와 exe 단계가 함께 쓴다
          $script = @'
          param($name, $program, $arguments, $port)
          $ErrorActionPreference = "Stop"
          $env:ALGOBLOCK_UI_DATA = Join-Path $env:RUNNER_TEMP "data-$name"
          $env:ALGOBLOCK_UI_PORT = "$port"
          $log = Join-Path $env:RUNNER_TEMP "server-$name"
          $server = Start-Process $program -ArgumentList $arguments -WorkingDirectory (Resolve-Path app) -PassThru -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err"
          try {
            $up = $false
            foreach ($i in 1..120) {
              try { Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5 | Out-Null; $up = $true; break } catch { Start-Sleep 1 }
            }
            if (-not $up) { throw "${name}: 서버가 뜨지 않았다" }
            $began = Get-Date
            $result = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$port/api/submit" -ContentType "application/json" -InFile (Join-Path $env:RUNNER_TEMP "submit.json") -TimeoutSec 300
            "${name}: ok=$($result.ok) status=$($result.status) cases=$($result.cases.Count) $([int]((Get-Date) - $began).TotalSeconds)초"
            if (-not $result.ok) { $result | ConvertTo-Json -Depth 6 | Write-Host; throw "${name}: 기본 문제 제출이 통과하지 않았다" }
            if ($result.notice) { throw "${name}: 실행 제한(작업 객체) 없이 돌았다: $($result.notice)" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Get-Process AlgoBlock -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue # onefile은 프로세스가 둘이다
            Get-Content "$log.err" -Tail 20 -ErrorAction SilentlyContinue
          }
          '@
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "submit.ps1") -Value $script -Encoding utf8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/packaging/models
          key: embed-model-${{ hashFiles('app/tutor/knowledge/embed.py') }}
      - name: 임베딩 모델 받기(캐시에 없을 때)와 해시 확인
        id: model
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -B tutor/knowledge/embed.py fetch packaging/models
          python -B -c "import hashlib; from tutor.knowledge import embed; bad = [n for n, (_, _, d) in embed.FILES.items() if hashlib.file_digest(open('packaging/models/' + n, 'rb'), 'sha256').hexdigest() != d]; assert not bad, bad"
      - name: 채점기 자체 시험 (러너에 있는 언어만 돈다)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: app/judge
        run: |
          foreach ($tool in 'python', 'node', 'javac', 'go', 'g++', 'clang++', 'rustc', 'kotlinc') {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            '{0}: {1}' -f $tool, $(if ($found) { $found.Source } else { '없음' })
          }
          python -B -m unittest test_check
      - name: 튜터 엔진 시험
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: app
        run: python -B -m unittest discover -s tutor/tests -t .
      - name: 화면 서버 시험
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: app
        run: python -B ui/test_server.py
      - name: 임베딩 색인 시간
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        working-directory: app
        shell: python
        run: |
          import json, os, sys, tempfile, time
          sys.path.insert(0, os.getcwd())
          from tutor.knowledge.index import open_index
          problems = json.load(open("ui/builtin.json", encoding="utf-8"))
          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as folder:
              began = time.perf_counter()
              index = open_index(folder, "packaging/models")
              assert index is not None, "색인을 열지 못했다(패키지나 모델 파일 없음)"
              index.embed(["확인"])  # 모델을 올린다
              loaded = time.perf_counter()
              for problem in problems:
                  index.put(problem["id"], problem["text"])
              done = time.perf_counter()
              assert index.count() == len(problems), index.count()
              index.close()
          line = f"임베딩 색인(Windows): 모델 올리기 {loaded - began:.1f}초, 기본 문제 글 {len(problems)}개 넣기 {done - loaded:.1f}초"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(line + "\n")
      - name: 소스 서버에 기본 문제 하나 제출
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          & (Join-Path $env:RUNNER_TEMP "submit.ps1") "source" (Get-Command python).Source @("-B", "ui/server.py") 8801
      - name: exe 빌드
        id: build
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File app\packaging\build_win.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content app\packaging\dist\SHA256SUMS-windows-x64
      - name: exe 서버(--server)에 기본 문제 하나 제출
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          & (Join-Path $env:RUNNER_TEMP "submit.ps1") "exe" (Resolve-Path app\packaging\dist\AlgoBlock.exe).Path @("--server") 8802


  publish-check:
    name: publish-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 기록 전체를 본다
          persist-credentials: false
      - name: 저장소 구조 시험
        working-directory: app
        run: python3 -B ui/test_structure.py
      - name: 공개 전 검사(지금 파일)
        working-directory: app
        run: python3 -B ui/test_publish.py
      - name: 공개 전 검사(모든 커밋)
        working-directory: app
        run: python3 -B ui/test_publish.py history

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # PR의 커밋 목록을 읽는다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 기록 전체를 본다
          persist-credentials: false
      # 개인 계정 저장소는 라이선스 키가 필요 없다. 찾은 값이 PR 댓글·산출물로 퍼지지 않게 둘 다 끈다
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # 이 저장소 안에서 올린 PR의 브랜치 이름을 본다(포크에서 온 PR과 main 푸시는 보지 않는다). 규칙은 .github/CONTRIBUTING.md
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 브랜치 이름이 규칙에 맞는지 본다
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then echo "보지 않는다"; exit 0; fi
          case "$HEAD_REF" in dependabot/*) echo "dependabot"; exit 0 ;; esac
          if printf '%s' "$HEAD_REF" | grep -Eq '^(feature|fix|refactor|chore|docs|problem)/([0-9]+-)?[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "맞는다: $HEAD_REF"
          else
            echo "브랜치 이름이 규칙과 다르다: $HEAD_REF (예: fix/12-empty-code-message)"; exit 1
          fi

  # ci.yml 안에서 룰셋(.github/rulesets/main.json)이 요구하는 검사는 이것 하나다(PR 제목은 pr-title.yml). 작업을 더하면 needs에만 더한다.
  ci-passed:
    name: ci-passed
    if: ${{ !cancelled() }}
    needs: [engine-tests, judge-tests, windows, publish-check, secret-scan, branch-name]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 앞 작업이 모두 성공했는지 본다
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "결과: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
