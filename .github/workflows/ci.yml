# PR과 main 푸시마다 시험과 공개 전 검사를 돌린다. 모델을 부르지 않는다(키가 필요 없다).
# 기본 문제 전체 검사(ui/problemkit.py check)는 느린 풀이가 시간 초과할 때까지 기다려 수십 분이 걸리므로 여기서 돌리지 않는다.
# 액션은 커밋 SHA로 고정한다(뒤의 주석이 그 버전이다). 갱신은 .github/dependabot.yml이 PR로 올린다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: engine-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install langgraph pypdf
      - name: 튜터 엔진 시험
        working-directory: app
        run: python -B -m unittest discover -s tutor/tests -t .
      - name: 화면 서버 시험
        working-directory: app
        run: python -B ui/test_server.py

  judge-tests:
    name: judge-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 채점기 자체 시험 (러너에 있는 언어만 돈다)
        working-directory: app/judge
        run: python -B -m unittest test_check

  publish-check:
    name: publish-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 기록 전체를 본다
          persist-credentials: false
      - name: 저장소 구조 시험
        working-directory: app
        run: python3 -B ui/test_structure.py
      - name: 공개 전 검사(지금 파일)
        working-directory: app
        run: python3 -B ui/test_publish.py
      - name: 공개 전 검사(모든 커밋)
        working-directory: app
        run: python3 -B ui/test_publish.py history

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # PR의 커밋 목록을 읽는다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 기록 전체를 본다
          persist-credentials: false
      # 개인 계정 저장소는 라이선스 키가 필요 없다. 찾은 값이 PR 댓글·산출물로 퍼지지 않게 둘 다 끈다
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # 이 저장소 안에서 올린 PR의 브랜치 이름을 본다(포크에서 온 PR과 main 푸시는 보지 않는다). 규칙은 .github/CONTRIBUTING.md
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 브랜치 이름이 규칙에 맞는지 본다
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then echo "보지 않는다"; exit 0; fi
          case "$HEAD_REF" in dependabot/*) echo "dependabot"; exit 0 ;; esac
          if printf '%s' "$HEAD_REF" | grep -Eq '^(feature|fix|refactor|chore|docs|problem)/([0-9]+-)?[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "맞는다: $HEAD_REF"
          else
            echo "브랜치 이름이 규칙과 다르다: $HEAD_REF (예: fix/12-empty-code-message)"; exit 1
          fi

  # 룰셋(.github/rulesets/main.json)이 요구하는 검사는 이것 하나다. 작업을 더하면 needs에만 더한다.
  ci-passed:
    name: ci-passed
    if: ${{ !cancelled() }}
    needs: [engine-tests, judge-tests, publish-check, secret-scan, branch-name]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 앞 작업이 모두 성공했는지 본다
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "결과: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
